name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/cloudnativedenmark/ticketbutler-proxy
  SERVICE: tbproxy

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # linux/amd64 only: Cloud Run has no arm64 runtime, so a multi-arch image
      # would double the build time to publish a layer nothing can run.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Deploys are pinned by digest, so the digest is the one output an operator
      # needs from this run. Put it where it can be copied without opening logs.
      - name: Write the deploy command to the run summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Image published"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Tags also pushed:"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo
            echo "### Deploy this revision"
            echo
            echo "Cloud Run caches images from public third-party registries for up"
            echo "to an hour, so a mutable tag such as \`latest\` can leave the old"
            echo "code running after an apparently successful deploy. Deploy the"
            echo "digest."
            echo
            echo '```sh'
            echo "./deploy/deploy.sh ${DIGEST}"
            echo '```'
            echo
            echo "The same thing without the script:"
            echo
            echo '```sh'
            echo "gcloud run deploy ${SERVICE} \\"
            echo "  --project=automation-472811 \\"
            echo "  --region=europe-north1 \\"
            echo "  --image=${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "That form keeps the environment variables and secrets already on"
            echo "the service. Use deploy/deploy.sh when any of those change."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Cloud Run
    needs: [publish]
    # Off until someone sets up Workload Identity Federation and the repo
    # variables. Until then the publish job's summary tells an operator what to
    # run by hand. See deploy/README.md for the setup.
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Keyless: the workflow trades its OIDC token for short-lived Google
      # credentials. No service account JSON key exists to leak or rotate.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Image only. Environment variables and secret bindings stay as the last
      # deploy/deploy.sh run left them, so a config change means running that
      # script rather than editing this workflow.
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ vars.GCP_REGION || 'europe-north1' }}
          project_id: ${{ vars.GCP_PROJECT || 'automation-472811' }}
          image: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
